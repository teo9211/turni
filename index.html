<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Turni">
<meta name="theme-color" content="#f2f2f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Turni</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111;--mut:#6b7280;--line:#e5e7eb;--acc:#0a84ff;--red:#ef4444;--ok:#16a34a;--sab:env(safe-area-inset-bottom)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mut:#9ca3af;--line:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,system-ui,"SF Pro Text",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.view{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(90px + var(--sab));max-width:640px;margin:0 auto}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:5}
.tab{flex:1;padding:8px 0 6px;text-align:center;font-size:11px;color:var(--mut);border:0;background:none}
.tab i{display:block;font-style:normal;font-size:22px}
.tab.on{color:var(--acc)}
h1{font-size:28px;margin:4px 0 12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:20px 4px 6px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ttl{flex:1;text-align:center;font-size:19px;font-weight:600}
.btn{border:0;background:var(--card);border-radius:10px;padding:8px 12px;color:var(--acc);font-weight:600}
.btn.pri{background:var(--acc);color:#fff}
.btn.del{color:var(--red)}
.btn.sm{padding:5px 9px;font-size:14px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>.l{flex:1;min-width:0}
.row>.r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.mut{color:var(--mut);font-size:13px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--mut);padding:2px 0}
.cell{background:var(--card);border-radius:9px;min-height:64px;padding:3px 3px 2px;border:2px solid transparent;overflow:hidden;position:relative}
.cell.today{border-color:var(--acc)}
.cell.blank{background:none}
.cell .n{font-size:12px;font-weight:600}
.cell.sun .n{color:var(--red)}
.pill{display:block;font-size:10px;color:#fff;border-radius:5px;padding:1px 3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bd{display:inline-block;font-size:9px;color:#fff;border-radius:4px;padding:0 3px;margin:2px 1px 0 0}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:7px;font-size:14px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 2px #0002}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:15px}
.chip.on{color:#fff;border-color:transparent}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input[type=color]{padding:0;width:38px;height:34px;flex:none}
input[type=checkbox]{width:auto}
.f{display:flex;gap:8px;align-items:center;margin:6px 0}
.f>label{width:92px;flex:none;font-size:14px;color:var(--mut)}
.days{display:flex;gap:4px}
.days button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 0;font-size:13px}
.days button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ov{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(24px + var(--sab))}
.sheet h3{margin:0 0 8px;font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + var(--sab));background:#111d;color:#fff;padding:9px 16px;border-radius:999px;z-index:30;font-size:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
td,th{padding:5px 2px;border-bottom:1px solid var(--line);text-align:right}
td:first-child,th:first-child{text-align:left}
.pos{color:var(--ok)}.neg{color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>

<script id="core">
/* ===== Date helpers (stringhe ISO YYYY-MM-DD, calcoli in UTC: nessun problema di ora legale) ===== */
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const fmtD=dt=>iso(dt.getUTCFullYear(),dt.getUTCMonth()+1,dt.getUTCDate());
const addDays=(s,n)=>{const d=parseD(s);d.setUTCDate(d.getUTCDate()+n);return fmtD(d);};
const dow=s=>parseD(s).getUTCDay(); // 0=dom ... 6=sab
const mondayOf=s=>addDays(s,-((dow(s)+6)%7));
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const todayISO=()=>{const n=new Date();return iso(n.getFullYear(),n.getMonth()+1,n.getDate());};
const daysInMonth=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const shiftHours=s=>{let d=toMin(s.end)-toMin(s.start);if(d<=0)d+=1440;return d/60;};

/* ===== Dati di default ===== */
function defaults(){return{
  v:1,
  shifts:[
    {id:'mat',name:'Mattino',start:'06:00',end:'12:00',days:[1,2,3,4,5,6],color:'#f59e0b'},
    {id:'pom',name:'Pomeriggio',start:'12:00',end:'19:30',days:[1,2,3,4,5],color:'#6366f1'},
    {id:'gio',name:'Giornata',start:'07:00',end:'14:30',days:[1,2,3,4,5],color:'#10b981'}
  ],
  rates:[
    {id:'base',name:'Paga oraria',value:0},
    {id:'sat',name:'Maggiorazione sabato (€/h in più)',value:0},
    {id:'dop',name:'Festivo paga doppia',value:0},
    {id:'tri',name:'Festivo paga tripla',value:0},
    {id:'str',name:'Straordinario',value:0},
    {id:'sts',name:'Straordinario sabato',value:0},
    {id:'msk',name:'Base indennità malattia (€/h)',value:0}
  ],
  badges:[
    {id:'fer',name:'Ferie',kind:'leave',rate:'base',color:'#ec4899',short:'FER'},
    {id:'ban',name:'Banca ore',kind:'bank',rate:'base',color:'#0ea5e9',short:'BO'},
    {id:'fd',name:'Festivo doppio',kind:'rate',rate:'dop',color:'#ef4444',short:'2×'},
    {id:'ft',name:'Festivo triplo',kind:'rate',rate:'tri',color:'#b91c1c',short:'3×'},
    {id:'str',name:'Straordinario',kind:'extra',rate:'str',color:'#8b5cf6',short:'STR'},
    {id:'sts',name:'Straordinario sabato',kind:'extra',rate:'sts',color:'#a855f7',short:'STS'},
    {id:'fes',name:'Festività non lavorata',kind:'leave',rate:'base',color:'#f472b6',short:'FES'},
    {id:'mal',name:'Malattia',kind:'sick',rate:'msk',policy:'mal',color:'#14b8a6',short:'MAL'},
    {id:'inf',name:'Infortunio',kind:'sick',rate:'base',policy:'inf',color:'#f97316',short:'INF'}
  ],
  bankRules:[],
  bankOpening:0,
  monthly:{on:false,hours:0},
  mig:4,
  sick:{policies:[
    {id:'mal',name:'Malattia comune (ISS)',tiers:[{from:1,to:14,pct:86},{from:15,to:180,pct:100},{from:181,to:365,pct:86}],short:{on:false,under:5,first:2,pct:50}},
    {id:'inf',name:'Infortunio / malattia professionale',tiers:[{from:1,to:365,pct:100}],short:{on:false,under:5,first:2,pct:50}}
  ]},
  tax:{on:true,iss:7.4,sind:0.4,fondiss:2.5,altre:0,months:13,smac:0,altreDetr:0,
    brackets:[{upTo:10000,rate:9},{upTo:18000,rate:13},{upTo:28000,rate:17},{upTo:38000,rate:21},{upTo:50000,rate:25},{upTo:65000,rate:28},{upTo:80000,rate:31},{upTo:null,rate:35}]},
  rotation:['mat','pom','gio'],
  days:{}
};}

/* ===== Malattia: episodi e percentuale per giorno ===== */
function pctFor(P,idx,len){
  if(P.short&&P.short.on&&len<P.short.under&&idx<=P.short.first)return P.short.pct;
  const t=P.tiers.find(q=>idx>=q.from&&idx<=q.to);
  if(t)return t.pct;
  return P.tiers.length?P.tiers[P.tiers.length-1].pct:100;
}
function sickMap(D){
  const isSick=x=>{const b=D.badges.find(q=>q.id===x.id);return b&&b.kind==='sick'?b:null;};
  const days=Object.keys(D.days).filter(ds=>(D.days[ds].b||[]).some(isSick)).sort();
  const eps=[];let ep=null;
  for(const ds of days){
    const b=(D.days[ds].b||[]).map(isSick).find(Boolean);
    let cont=false;
    if(ep&&ep.pol===b.policy){
      cont=diffDays(ep.last,ds)-1<=3; // si uniscono solo pause senza turno di al massimo 3 giorni (weekend / festivo)
      for(let x=addDays(ep.last,1);cont&&x<ds;x=addDays(x,1)){const e=D.days[x];if(e&&e.s){cont=false;break;}}
    }
    if(!cont){ep={pol:b.policy,start:ds,last:ds,days:[]};eps.push(ep);}
    ep.last=ds;ep.days.push(ds);
  }
  const map={};
  eps.forEach((e,i)=>{
    const len=diffDays(e.start,e.last)+1;
    const P=((D.sick&&D.sick.policies)||[]).find(q=>q.id===e.pol);
    for(const ds of e.days){const idx=diffDays(e.start,ds)+1;map[ds]={pct:P?pctFor(P,idx,len):100,idx,len,ep:i};}
  });
  return{map,n:eps.length};
}

/* ===== Perdita banca ore settimanale (es. settimana da 6h) assorbita dallo straordinario ===== */
function ruleFor(D,w){return (D.bankRules||[]).find(q=>q.over!=null?w>q.over+1e-9:Math.abs(q.hours-w)<0.01);}
function weekMap(D,sm){
  sm=sm||sickMap(D);
  const weeks={};
  for(const ds of Object.keys(D.days).sort()){const k=mondayOf(ds);(weeks[k]=weeks[k]||[]).push(ds);}
  const loss={},abs={};
  const wr=(D.bankRules||[]).find(q=>q.weekly&&q.delta<0);
  if(!wr)return{loss,abs};
  for(const wk in weeks){
    let at=null,ot=0,tot=0,nl=false;const ots=[];
    for(const ds of weeks[wk]){
      const r=calcDay(D,ds,sm,null);
      if(D.days[ds].nl)nl=true;
      tot+=r.worked+r.leaveH+r.sickH+r.bankH;
      if(!at&&r.shiftId&&Math.abs(r.H-wr.hours)<0.01)at=ds;
      if(r.extraRaw>0){ots.push([ds,r.extraRaw]);ot+=r.extraRaw;}
    }
    if(!at||nl)continue;
    const full=-wr.delta;
    const need=wr.target?Math.min(full,Math.max(0,wr.target-tot)):full;
    if(need<=1e-9)continue;
    const cover=Math.min(ot,need);
    loss[at]=cover>=need?0:-(need-cover);
    let rem=cover;
    for(const [ds,hh] of ots){if(rem<=1e-9)break;const a=Math.min(hh,rem);abs[ds]=a;rem-=a;}
  }
  return{loss,abs};
}

/* ===== Calcolo giornata ===== */
const add=(o,k,v)=>{o[k]=(o[k]||0)+v;};
function calcDay(D,ds,sm,wm){
  sm=sm||sickMap(D);
  if(wm===undefined)wm=weekMap(D,sm);
  const e=D.days[ds];
  const r={ds,shiftId:null,H:0,worked:0,counted:false,leaveH:0,bankH:0,extraH:0,pay:{},total:0,bankDelta:0,hoursBy:{},sickH:0,rule:null,lossH:0,fesRem:0,H0:0,extraRaw:0,extraAbs:0,rateH:0,satH:0,festBase:false,rateId:null};
  if(!e)return r;
  const rate=id=>{const x=D.rates.find(q=>q.id===id);return x?x.value:0;};
  const shift=D.shifts.find(s=>s.id===e.s);
  const H0=shift?shiftHours(shift):0;
  const H=(shift&&e.w!=null&&e.w>=0)?e.w:H0;
  r.shiftId=shift?shift.id:null;r.H=H;r.H0=H0;
  const bs=(e.b||[]).map(x=>({x,b:D.badges.find(q=>q.id===x.id)})).filter(q=>q.b);
  let cov=0;
  for(const kind of ['leave','sick','bank'])for(const {x,b} of bs)if(b.kind===kind){
    const want=x.h==null?H:x.h;
    const hh=Math.max(0,Math.min(want,H-cov));
    cov+=hh;
    add(r.hoursBy,b.id,hh);
    const sp=kind==='sick'?((sm.map[ds]||{}).pct??100)/100:1;
    add(r.pay,'b:'+b.id,hh*rate(b.rate)*sp);
    if(kind==='leave')r.leaveH+=hh;else if(kind==='sick')r.sickH+=hh;else r.bankH+=hh;
  }
  r.worked=Math.max(0,H-cov);
  if(r.worked<1e-9)r.worked=0;
  r.counted=r.worked>0;
  const rb=bs.find(q=>q.b.kind==='rate');
  if(r.worked>0){
    if(rb){
      add(r.pay,'b:'+rb.b.id,r.worked*rate(rb.b.rate));r.rateH=r.worked;r.rateId=rb.b.id;r.festBase=rb.b.inclBase!==false;
      if(!(D.monthly&&D.monthly.on)){const rem=Math.max(0,H0-H);if(rem>0){r.fesRem=rem;add(r.pay,'fes',rem*rate('base'));}}
    }
    else{
      add(r.pay,'ord',r.worked*rate('base'));
      if(dow(ds)===6){add(r.pay,'sat',r.worked*rate('sat'));r.satH=r.worked;}
    }
    const rule=ruleFor(D,r.worked);
    if(rule&&!(rule.weekly&&rule.delta<0)){r.rule=rule;r.bankDelta=rule.delta;}
  }
  if(wm&&wm.loss[ds]){
    r.bankDelta+=wm.loss[ds];r.lossH=-wm.loss[ds];
    if(!(D.monthly&&D.monthly.on)){const bb=D.badges.find(q=>q.kind==='bank');if(bb)add(r.pay,'b:'+bb.id,r.lossH*rate(bb.rate));}
  }
  for(const {x,b} of bs)if(b.kind==='extra'){
    const raw=x.h||0,ab=Math.min(raw,wm?(wm.abs[ds]||0):0),hh=raw-ab;
    r.extraRaw+=raw;r.extraAbs+=ab;r.extraH+=hh;add(r.hoursBy,b.id,hh);add(r.pay,'b:'+b.id,hh*rate(b.rate));
  }
  r.total=Object.values(r.pay).reduce((a,b)=>a+b,0);
  return r;
}

function aggregate(D,from,to){
  const A={from,to,shiftCount:{},shiftHours:{},worked:0,leaveH:0,bankUsed:0,extraH:0,pay:{},hrs:{},total:0,earned:0,lost:0,badgeDays:{},badgeHours:{},workedDays:0,boaH:0,sickDays:0,sickEp:0,sickH:0,absH:0,badgeMarked:{},fixed:false,net:0,ded:{iss:0,sind:0,fond:0,lorda:0,igr:0}};
  const fixed=!!(D.monthly&&D.monthly.on);A.fixed=fixed;
  const base=(D.rates.find(q=>q.id==='base')||{value:0}).value;
  const months={},sm=sickMap(D),wm=weekMap(D,sm),eps=new Set();
  for(const ds of Object.keys(D.days)){
    if(ds<from||ds>to)continue;
    const e=D.days[ds],r=calcDay(D,ds,sm,wm),mk=ds.slice(0,7);
    const M=months[mk]||(months[mk]={pay:{},hrs:{},fesH:0,noFestH:0,leaveH:0,bankH:0,extraH:0,sickH:0,hasShift:false});
    if(r.shiftId)M.hasShift=true;
    if(r.counted){A.shiftCount[r.shiftId]=(A.shiftCount[r.shiftId]||0)+1;add(A.shiftHours,r.shiftId,r.worked);A.workedDays++;}
    A.worked+=r.worked;A.absH+=r.extraAbs;A.sickH+=r.sickH;A.leaveH+=r.leaveH;A.bankUsed+=r.bankH;A.extraH+=r.extraH;
    for(const k in r.pay){if(fixed&&k==='ord')continue;add(M.pay,k,r.pay[k]);}
    if(!fixed&&r.worked>0&&!r.rateH)add(M.hrs,'ord',r.worked);
    if(r.satH)add(M.hrs,'sat',r.satH);
    if(r.rateH)add(M.hrs,'b:'+r.rateId,r.rateH);
    if(r.lossH&&!fixed){const bb=D.badges.find(q=>q.kind==='bank');if(bb)add(M.hrs,'b:'+bb.id,r.lossH);}
    if(r.fesRem)add(M.hrs,'fes',r.fesRem);
    M.fesH+=r.festBase?r.rateH:0;M.noFestH+=r.rateH?0:r.worked;M.leaveH+=r.leaveH;M.sickH+=r.sickH;M.bankH+=r.bankH;M.extraH+=r.extraH;
    if(r.bankDelta>0)A.earned+=r.bankDelta;else A.lost-=r.bankDelta;
    for(const x of e.b||[]){
      const b=D.badges.find(q=>q.id===x.id);if(!b)continue;
      add(A.badgeMarked,b.id,1);
      if(b.kind==='sick'){A.sickDays++;eps.add(sm.map[ds]?sm.map[ds].ep:-1);}
      const hh=r.hoursBy[b.id]||0;
      if(b.kind!=='rate')add(M.hrs,'b:'+b.id,hh);
      add(A.badgeHours,b.id,b.kind==='rate'?0:hh);
      add(A.badgeDays,b.id,b.kind==='rate'?1:(b.kind==='extra'?0:(r.H?hh/r.H:0)));
    }
  }
  for(const mk in months){
    const M=months[mk];
    if(fixed&&M.hasShift){
      const ord=Math.max(0,D.monthly.hours-M.fesH-M.leaveH-M.sickH-M.bankH-M.extraH);
      M.pay.ord=ord*base;M.hrs.ord=ord;
      if(M.fesH){M.pay.fes=M.fesH*base;M.hrs.fes=M.fesH;}
      A.boaH+=Math.max(0,M.noFestH-ord);
    }
    const g=Object.values(M.pay).reduce((a,b)=>a+b,0);
    if(D.tax&&D.tax.on&&g>0){const n=netOf(D,g);A.ded.iss+=n.iss;A.ded.sind+=n.sind;A.ded.fond+=n.fond;A.ded.lorda+=n.lorda;A.ded.igr+=n.igr;A.net+=n.net;}
    else A.net+=g;
    for(const k in M.pay)add(A.pay,k,M.pay[k]);
    for(const k in M.hrs)add(A.hrs,k,M.hrs[k]);
  }
  A.total=Object.values(A.pay).reduce((a,b)=>a+b,0);
  A.sickEp=eps.size;
  return A;
}

/* ===== Netto (ritenute San Marino: ISS, Fondiss, IGR su base annualizzata) ===== */
const r2=x=>Math.round((x+1e-9)*100)/100;
function netOf(D,gross){
  const T=D.tax,p=k=>(T[k]||0)/100;
  const iss=r2(gross*p('iss')),sind=r2(gross*p('sind')),fond=r2(gross*p('fondiss'));
  const imp=r2(gross*(1-p('iss')-p('sind')-p('fondiss')-p('altre')));
  const n=T.months||13,annual=imp*n;
  let tax=0,prev=0;
  for(const b of T.brackets){const top=b.upTo==null?Infinity:b.upTo;if(annual>prev)tax+=(Math.min(annual,top)-prev)*b.rate/100;prev=top;if(annual<=top)break;}
  const lorda=r2(tax/n);
  const igr=Math.max(0,r2(lorda-(T.smac||0)-(T.altreDetr||0)));
  return{iss,sind,fond,imp,lorda,igr,net:r2(gross-iss-sind-fond-igr)};
}

function bankBalance(D,upTo){
  let t=D.bankOpening||0;const sm=sickMap(D),wm=weekMap(D,sm);
  for(const ds of Object.keys(D.days)){if(ds>upTo)continue;const r=calcDay(D,ds,sm,wm);t+=r.bankDelta-r.bankH;}
  return t;
}

/* ===== Modifica giorni ===== */
function migrate(D){
  const d0=defaults();
  for(const k of ['sick','tax','monthly'])if(!D[k])D[k]=d0[k];
  if(!D.mig){for(const b of d0.badges)if(b.kind==='sick'&&!D.badges.some(x=>x.id===b.id))D.badges.push(b);D.mig=2;}
  if(D.mig<3){D.bankRules.forEach(r=>{if(r.delta<0&&r.weekly===undefined)r.weekly=true;});D.mig=3;}
  if(D.mig<4){
    for(const x of d0.rates)if(!D.rates.some(q=>q.id===x.id))D.rates.push(x);
    for(const b of d0.badges)if((b.id==='sts'||b.id==='fes')&&!D.badges.some(q=>q.id===b.id))D.badges.push(b);
    D.mig=4;

/* mode: 'empty' = solo giorni senza turno; 'shift' = sostituisce i turni e tiene i badge; 'all' = sostituisce tutto */
function generate(D,{from,to,startIndex,mode}){
  const rot=D.rotation;if(!rot.length)return 0;
  const m0=mondayOf(from);let n=0;
  for(let ds=from;ds<=to;ds=addDays(ds,1)){
    const wk=Math.floor(diffDays(m0,ds)/7);
    const id=rot[((startIndex+wk)%rot.length+rot.length)%rot.length];
    const sh=D.shifts.find(s=>s.id===id);
    const ok=sh&&sh.days.includes(dow(ds));
    const cur=D.days[ds];
    if(mode==='empty'){if(cur&&cur.s)continue;if(!ok)continue;getDay(D,ds).s=sh.id;n++;continue;}
    if(mode==='all')delete D.days[ds];
    if(ok){getDay(D,ds).s=sh.id;n++;}
    else if(D.days[ds])D.days[ds].s=null;
    cleanDay(D,ds);
  }

/* ===== REPORT TESTUALE ===== */
function buildReport(from,to,title,detail){
  const y=+from.slice(0,4),m1=+from.slice(5,7),m2=+to.slice(5,7);
  const base=(D.rates.find(r=>r.id==='base')||{}).value||0;
  const f1=x=>N5.format(Math.round(x*100)/100);
  const sh=D.shifts,L=[];
  L.push('REPORT TURNI – '+title);
  L.push('Paga '+N5.format(base)+' €/h · '+(D.monthly.on?'monte ore '+D.monthly.hours+' h/mese':'paga a ore')+' · saldo iniziale banca '+fh(D.bankOpening||0));
  L.push('Regole banca: '+D.bankRules.map(r=>(r.over!=null?'oltre '+fh(r.over):fh(r.hours))+' → '+fh(r.delta,true)).join(' · '));
  L.push('');
  L.push('MESE | Gg | Ore | '+sh.map(short3).join(' | ')+' | Ferie h | BO usata h | Mal h | Str h | Lordo | Netto');
  const row=(lab,a)=>lab+' | '+a.workedDays+' | '+f1(a.worked)+' | '+sh.map(x=>a.shiftCount[x.id]||0).join(' | ')+' | '+f1(a.leaveH)+' | '+f1(a.bankUsed)+' | '+f1(a.sickH)+' | '+f1(a.extraH)+' | '+f1(a.total)+' | '+f1(a.net);
  for(let m=m1;m<=m2;m++){const mf=iso(y,m,1),me=iso(y,m,daysInMonth(y,m));L.push(row(MONTHS[m-1].slice(0,3),aggregate(D,mf,me<to?me:to)));}
  L.push(row('TOT',aggregate(D,from,to)));
  L.push('');
  L.push('BANCA ORE: mese | maturata | persa | goduta | saldo cumulato');
  for(let m=m1;m<=m2;m++){const mf=iso(y,m,1),me=iso(y,m,daysInMonth(y,m)),e2=me<to?me:to,a=aggregate(D,mf,e2);L.push(MONTHS[m-1].slice(0,3)+' | '+fh(a.earned,true)+' | '+(a.lost?fh(-a.lost):'0h')+' | '+fh(a.bankUsed)+' | '+fh(bankBalance(D,e2)));}
  const T=aggregate(D,from,to);
  L.push('TOT | '+fh(T.earned,true)+' | '+(T.lost?fh(-T.lost):'0h')+' | '+fh(T.bankUsed)+' | '+fh(bankBalance(D,to)));
  if(detail){
    L.push('');L.push('DETTAGLIO GIORNI: data | turno | ore lavorate | badge | banca');
    const sm=sickMap(D),wm=weekMap(D,sm);
    for(const ds of Object.keys(D.days).sort()){
      if(ds<from||ds>to)continue;
      const e=D.days[ds];if(!e.s&&!(e.b&&e.b.length))continue;
      const r=calcDay(D,ds,sm,wm),s0=shiftOf(e.s);
      const bd=(e.b||[]).map(x=>{const b=badgeOf(x.id);return b?b.short+(x.h==null?'':'('+f1(x.h)+'h)'):'';}).join(',');
      L.push(ds.slice(8,10)+'/'+ds.slice(5,7)+' '+WD[(dow(ds)+6)%7]+' | '+(s0?short3(s0):'-')+' | '+f1(r.worked)+' | '+(bd||'-')+' | '+(r.bankDelta?fh(r.bankDelta,true):'')+(r.bankH?(r.bankDelta?' ':'')+'uso '+fh(r.bankH):'')+(r.extraAbs?' (straord. assorbito '+f1(r.extraAbs)+'h)':''));
    }
  }
  return L.join('\n');
}
function openReport(from,to,title){
  const st={detail:true};
  openSheet(rebuild=>{
    const txt=buildReport(from,to,title,st.detail);
    const ta=h('textarea',{rows:'16',readonly:true,wrap:'off',style:'font-family:ui-monospace,Menlo,monospace;font-size:11px;white-space:pre'},txt);
    return h('div',null,h('h3',null,'Report: '+title),

}

async function exportData(){
  const f=new File([JSON.stringify(D,null,1)],'turni-backup-'+todayISO()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=h('a',{href:URL.createObjectURL(f),download:f.name});document.body.append(a);a.click();a.remove();
}
function openPaste(){
  openSheet(rebuild=>{
    const ta=h('textarea',{rows:'10',placeholder:'Incolla qui il backup (testo JSON)',style:'font-size:12px'});

      h('div',{style:'display:flex;gap:8px;margin-top:12px'},btn('Annulla',closeSheet),h('div',{style:'flex:1'}),
        btn('Importa',()=>{try{const o=JSON.parse(ta.value);if(!o.shifts||!o.days)throw 0;D=migrate(Object.assign(defaults(),o,{mig:o.mig||0}));save();closeSheet();render();toast('Backup importato');}catch(x){toast('Testo non valido');}},'pri')));
  });
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const o=JSON.parse(t);if(!o.shifts||!o.days)throw 0;D=migrate(Object.assign(defaults(),o,{mig:o.mig||0}));save();render();toast('Backup importato');}catch(x){toast('File non valido');}});
}
